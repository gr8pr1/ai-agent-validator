# Example carve-out bundle — copy rules into your fork of generic-agent.yaml,
# bump policy_bundle.version, re-sign, and policyctl load.
#
# This example allows an internal package registry while keeping public-egress
# in shadow mode for observation.

policy_bundle:
  version: 2
  agent_scope: "agent"
  signed_by: "ops-team"
  default_action: allow
  fail_direction: open
  rules:
    - id: allow-localhost
      rationale: "Loopback services are allowed."
      match:
        action: connect
        dest_ip_in: ["127.0.0.0/8"]
      decision: allow
      state: enforced

    - id: allow-internal-registry
      rationale: "Carve-out: internal npm/pypi registry on 10.0.0.0/8:443."
      match:
        action: connect
        dest_ip_in: ["10.0.0.0/8"]
        dest_port_in: [443]
      decision: allow
      state: enforced

    - id: shadow-public-egress
      rationale: "Log public egress; registry carve-out above takes precedence."
      match:
        action: connect
        dest_ip_not_in:
          - "10.0.0.0/8"
          - "127.0.0.0/8"
          - "192.168.0.0/16"
          - "172.16.0.0/12"
      decision: deny
      state: shadow

    - id: deny-cred-file-read
      rationale: "Agents must not read credential files or SSH private keys."
      match:
        action: open
        path_in:
          - "/etc/shadow"
          - "/etc/gshadow"
          - "/root/.ssh/*"
          - "/home/*/.ssh/*"
      decision: deny
      state: enforced

    - id: deny-disable-enforcer
      rationale: "Agents must not tamper with the validator or pinned BPF maps."
      match:
        action: open|write|unlink
        path_in:
          - "/etc/ai-agent-validator/*"
          - "/sys/fs/bpf/ai-agent-validator/*"
      decision: deny
      state: enforced

    - id: deny-destroy-system-paths
      rationale: "Block destructive changes to OS-critical paths."
      match:
        action: write|unlink|rename
        path_in:
          - "/etc/*"
          - "/boot/*"
          - "/usr/*"
          - "/bin/*"
          - "/sbin/*"
          - "/lib/*"
      decision: deny
      state: enforced
